servers:
  registry:
    connection:
      type: postgres
      host: localhost
      port: 5432
      db: db
      user: dbuser
      pass: dbpass
    plan:
      local:
        storage: local
        interval: "0 5 * * 1"
        capacity: 10
        notifications:
          - slack
storages:
  local:
    type: local
    path: /annium/backups
  s3:
    type: s3
    access_key: secret_access_key
    access_secret: secret_access_secret
    server: https://storage.yandexcloud.net
    region: us-east-1
    encryption_key: encryption_key
    path: /annium/backups
notifications:
  slack:
    type: slack
    team: T12345678
    channel: B12345768
    token: OAuthTokenGoesHere
